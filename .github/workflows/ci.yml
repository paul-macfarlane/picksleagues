# Green CI is the merge gate to staging; the staging -> main promotion PR
# re-runs this same suite (branch protection is configured in the GitHub UI).
# No push trigger on main (FND-12): Vercel deploys on that same push, so a
# post-merge run could only report after prod was already live — the
# promotion PR has already run the identical suite on the identical tree.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - staging

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Matches DATABASE_URL below; the integration suite creates/migrates
          # its own picksleagues_test database against this same server.
          POSTGRES_DB: picksleagues
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d picksleagues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write CI env file
        # apps/api's dev script (used by test:e2e's webServer) hard-requires a
        # root .env; loadEnv validates it at boot (packages/core/src/env.ts).
        # These are CI-only throwaway values, never real secrets.
        run: |
          cat > .env <<EOF
          APP_ENV=local
          SIM_ENABLED=true
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/picksleagues
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost:5173
          GOOGLE_CLIENT_ID=ci-placeholder-google-client-id
          GOOGLE_CLIENT_SECRET=ci-placeholder-google-client-secret
          DISCORD_CLIENT_ID=ci-placeholder-discord-client-id
          DISCORD_CLIENT_SECRET=ci-placeholder-discord-client-secret
          JOB_SECRET=$(openssl rand -hex 32)
          EOF

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/picksleagues

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The prerender's own proof (LNCH-13): it asserts every public route
      # rendered its content rather than an error boundary, and throws if the
      # shell's tags stopped matching. Without this step those guards fire for
      # the first time in a Vercel build, so a page that ships as "Something
      # went wrong!" fails the deploy instead of the pull request.
      - name: Web build
        run: pnpm --filter @picksleagues/web build

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/picksleagues_test

      - name: OpenAPI contract check
        run: pnpm contract:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Capture review screenshots
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-review')
        run: pnpm test:e2e --project simulated --no-deps --grep capture
        env:
          REVIEW_CAPTURE: "1"

      - name: Upload review screenshots
        if: success() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-review')
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshots-pr-${{ github.event.pull_request.number }}
          path: test-results/review-screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Capture light-mode audit
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'light-mode-audit')
        run: pnpm test:e2e e2e/capture-vis.sim.spec.ts --project simulated --no-deps
        env:
          LIGHT_CAPTURE: "1"

      - name: Upload light-mode audit
        if: success() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'light-mode-audit')
        uses: actions/upload-artifact@v4
        with:
          name: light-mode-audit-pr-${{ github.event.pull_request.number }}
          path: |
            test-results/review-screenshots/vis-8/pickem-ats-my-picks-*.png
            test-results/review-screenshots/vis-8/pickem-settled-league-picks-*-light.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
