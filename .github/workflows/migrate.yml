# Applies drizzle migrations to the environment matching the pushed branch
# (ADR-0003: PRs merge to staging → Neon staging; staging merges to main →
# Neon primary; the promotion flow means staging always migrates before prod
# reaches the same commit).
#
# Required repo secrets (docs/runbooks/environments.md §Migrations) — use the
# DIRECT (non-pooler) Neon URLs; DDL doesn't mix with transaction pooling:
#   STAGING_DATABASE_URL — Neon `staging` branch connection string
#   PROD_DATABASE_URL    — Neon primary branch connection string
#
# Each branch maps to exactly one secret — no fallback, so main can never
# migrate the staging database. Until the branch's secret exists the job
# logs a notice and exits green before installing anything.
#
# `workflow_dispatch` is the fallback for a push whose run never started —
# GitHub dropped the push event for PR #177's merge to staging, so Vercel
# deployed code expecting a column the database didn't have. Run it from the
# Actions tab ("Run workflow", branch = staging or main) or
# `gh workflow run migrate.yml --ref staging`. Migrations are idempotent, so a
# manual run on an up-to-date database is a no-op. Dispatch accepts any ref,
# so the guard below refuses every ref but the two branches rather than
# letting a feature branch's migrations reach a deployed database.
name: Migrate

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Resolve target database
        id: guard
        run: |
          # The full ref, not GITHUB_REF_NAME: a tag named `main` has that
          # short name too.
          case "$GITHUB_REF" in
            refs/heads/main) url="$PROD_DATABASE_URL" ;;
            refs/heads/staging) url="$STAGING_DATABASE_URL" ;;
            *)
              echo "::error::Migrate only runs from the staging or main branch (got $GITHUB_REF)."
              exit 1
              ;;
          esac
          if [ -z "$url" ]; then
            echo "::notice::No database secret configured for $GITHUB_REF_NAME yet — skipping migrations."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # drizzle-kit's spinner swallows connection/auth errors (exit 1 with no
      # message — cost a real outage diagnosis on 2026-07-22), so fail here
      # first with the actual reason. Quoted values in psql's error (host,
      # user) are redacted: this repo is public, so Actions logs are too.
      - name: Connectivity preflight
        if: steps.guard.outputs.run == 'true'
        run: |
          if ! err=$(psql "$DATABASE_URL" -tAc 'select 1' 2>&1 >/dev/null); then
            echo "::error::Target database unreachable: $(printf '%s' "$err" | sed -E 's/"[^"]*"/<redacted>/g')"
            exit 1
          fi
          echo "Target database reachable."

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: steps.guard.outputs.run == 'true'
        run: pnpm db:migrate
