<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picks Leagues</title>
    <meta name="description" content="Sports pick'em leagues with friends." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Picks Leagues" />
    <meta property="og:description" content="Sports pick'em leagues with friends." />
    <meta property="og:type" content="website" />
    <!-- og:url/og:image are absolute by spec, so they name the canonical prod
         origin even on staging — link unfurls should sell the real app. -->
    <meta property="og:url" content="https://www.picksleagues.com/" />
    <meta property="og:image" content="https://www.picksleagues.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Anti-FOUC: apply the resolved theme before React mounts. The storage key
      // here is intentionally coupled to next-themes' ThemeProvider storageKey
      // ("picksleagues-theme") in src/main.tsx — keep them in sync.
      try {
        var stored = localStorage.getItem("picksleagues-theme");
        var isDark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
