<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picks Leagues</title>
    <script>
      // Anti-FOUC: apply the resolved theme before React mounts. The storage key
      // here is intentionally coupled to next-themes' ThemeProvider storageKey
      // ("picksleagues-theme") in src/main.tsx — keep them in sync.
      try {
        var stored = localStorage.getItem("picksleagues-theme");
        var isDark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
